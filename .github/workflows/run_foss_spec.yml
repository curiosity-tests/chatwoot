    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install pnpm dependencies
      run: pnpm i
    - name: Run frontend tests
      run: pnpm run test:coverage

  # Backend tests with parallelization
    - name: Check observables and crashes
