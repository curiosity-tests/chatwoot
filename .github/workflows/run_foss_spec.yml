        lfs: false
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install pnpm dependencies
      run: pnpm i
    - name: Run ESLint
      run: pnpm run eslint

  # Frontend tests run in parallel with backend
